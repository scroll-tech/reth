[package]
name = "scroll-alloy-rpc-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true

[dev-dependencies]
similar-asserts = "1.6"

[dependencies]
scroll-alloy-consensus = { workspace = true, features = ["serde"] }

alloy-network-primitives = { version = "0.6.4", default-features = true }
alloy-rpc-types-eth = { version = "0.6.4", features = ["serde"], default-features = false }
alloy-primitives = { version = "0.8.12", features = ["map", "rlp", "serde"], default-features = false }
alloy-consensus = { version = "0.6.4", features = ["arbitrary"], default-features = false }
alloy-eips = { version = "0.6.4", features = ["serde"], default-features = false }
alloy-serde = { version = "0.6.4", default-features = false }
derive_more = { version = "1.0", default-features = false }
serde = { version = "1.0", features = ["derive", "alloc", "derive"], default-features = false }
serde_json = { version = "1.0", features = ["alloc"], default-features = false }
arbitrary = { version = "1.3", features = ["derive", "derive"], optional = true }

[features]
default = ["std"]
arbitrary = [
    "std",
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
    "alloy-rpc-types-eth/arbitrary",
]
k256 = [
    "alloy-rpc-types-eth/k256",
]
std = [
    "alloy-network-primitives/std",
    "alloy-eips/std",
    "alloy-primitives/std",
    "alloy-rpc-types-eth/std",
]
[lints.clippy]
missing-const-for-fn = "warn"
option-if-let-else = "warn"
redundant-clone = "warn"
use-self = "warn"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
rust-2018-idioms = "deny"
unnameable-types = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"

[lints.rustdoc]
all = "warn"